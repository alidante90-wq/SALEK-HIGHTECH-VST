name: GITI FX VST3 — SALEK HIGHTECH
on:
  push:
    branches: [ giti-fx ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Clone JUCE 8.0.4
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-giti-fx -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build GITI FX
        shell: pwsh
        run: cmake --build build-giti-fx --config Release --parallel
      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $vst = Get-ChildItem build-giti-fx -Recurse -Directory -Filter "GITI FX.vst3" | Select-Object -First 1
          if (-not $vst) { $vst = Get-ChildItem build-giti-fx -Recurse -Directory -Filter "*.vst3" | Where-Object { $_.FullName -notmatch "CMakeFiles|_deps" } | Select-Object -First 1 }
          if (-not $vst) { throw "GITI FX VST3 not found" }
          Copy-Item $vst.FullName "release\GITI FX BY SALEK HIGHTECH.vst3" -Recurse -Force
          Compress-Archive -Path "release\*" -DestinationPath "GITI_FX_BY_SALEK_HIGHTECH_VST3.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GITI-FX-BY-SALEK-HIGHTECH-VST3
          path: GITI_FX_BY_SALEK_HIGHTECH_VST3.zip
          if-no-files-found: error
