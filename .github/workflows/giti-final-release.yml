name: GITI BY SALEK — FINAL RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - giti-by-salek-hightech

permissions:
  contents: write

jobs:
  build-release:
    name: GITI BY SALEK
    runs-on: windows-2022
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-8.0.4-giti-final-v1

      - name: Clone JUCE 8.0.4
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-final -G Ninja -DCMAKE_BUILD_TYPE=Release -DGITI_EDITION_ID=1

      - name: Build
        shell: pwsh
        run: cmake --build build-final --config Release --parallel

      - name: Run SHAE self-test
        shell: pwsh
        run: |
          $test = Get-ChildItem build-final -Recurse -Filter "GITI_SHAE_SELFTEST.exe" | Select-Object -First 1
          if (-not $test) { throw "GITI_SHAE_SELFTEST.exe not found" }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "SHAE self-test failed with exit code $LASTEXITCODE" }

      - name: Stage GITI BY SALEK package
        shell: pwsh
        run: |
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $vst3 = Get-ChildItem build-final -Recurse -Directory -Filter "GITI BY SALEK HIGHTECH.vst3" | Select-Object -First 1
          if (-not $vst3) { $vst3 = Get-ChildItem build-final -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1 }
          $exe = Get-ChildItem build-final -Recurse -Filter "*.exe" | Where-Object { $_.FullName -notmatch "SHAE|juce_vst3_helper" } | Select-Object -First 1

          if (-not $vst3) { throw "VST3 artifact not found" }
          if (-not $exe) { throw "Standalone artifact not found" }

          Copy-Item -Recurse $vst3.FullName "package\GITI BY SALEK HIGHTECH.vst3"
          Copy-Item $exe.FullName "package\GITI BY SALEK HIGHTECH.exe"
          if (Test-Path "Source\Assets") { Copy-Item -Recurse "Source\Assets" "package\Assets" }

          Get-ChildItem package -Recurse | Select-Object FullName,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build GITI BY SALEK installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "/Qp" "/DMyAppVersion=1.0.0" "/DMyAppEdition=001" "/DMyAppEditionName=ORIGIN" "/DMyPluginFile=GITI BY SALEK HIGHTECH.vst3" "/DMyStandaloneFile=GITI BY SALEK HIGHTECH.exe" "/DMyInstallDir=GITI BY SALEK HIGHTECH" "/DMyOutputBaseFilename=GITI BY SALEK Setup" "Installer\GITI_BY_SALEK_HIGHTECH.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Create GITI BY SALEK release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "package\GITI BY SALEK HIGHTECH.vst3" "release\GITI BY SALEK HIGHTECH.vst3" -Recurse
          Copy-Item "package\GITI BY SALEK HIGHTECH.exe" "release\GITI BY SALEK HIGHTECH.exe"
          if (Test-Path "package\Assets") { Copy-Item "package\Assets" "release\Assets" -Recurse }
          Copy-Item "installer-output\GITI BY SALEK Setup.exe" "release\GITI BY SALEK Setup.exe"
          Compress-Archive -Path "release\*" -DestinationPath "GITI BY SALEK.zip" -Force

      - name: Upload GITI BY SALEK release
        uses: actions/upload-artifact@v4
        with:
          name: GITI BY SALEK
          path: |
            GITI BY SALEK.zip
            release/GITI BY SALEK Setup.exe
          if-no-files-found: error
