name: Build SALEK HIGHTECH VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package VST3 + Standalone
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe  = Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -notmatch "cmake|ninja|juce|CMake" } | Select-Object -First 1
          if ($vst3) { Copy-Item -Recurse $vst3.FullName "artifact/SALEK HIGHTECH.vst3" }
          if ($exe)  { Copy-Item $exe.FullName "artifact/SALEK HIGHTECH.exe" }
          if (-not (Get-ChildItem artifact -ErrorAction SilentlyContinue)) {
            Write-Error "No VST3 or Standalone produced"
            Get-ChildItem -Path build -Recurse -Include *.exe,*.vst3,*.dll | Select-Object FullName
            exit 1
          }
          Compress-Archive -Path artifact/* -DestinationPath SALEK-HIGHTECH-Build.zip -Force

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SALEK-HIGHTECH-Build
          path: SALEK-HIGHTECH-Build.zip
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
