name: Build All GITI Artist Versions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-all-artists:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build all artist variants and installers
        shell: pwsh
        run: .\tools\Build-All-Artists.ps1 -Configuration Release
      - name: Upload all artist packages
        uses: actions/upload-artifact@v4
        with:
          name: GITI-All-Artist-Builds
          path: dist/**
          retention-days: 14
          if-no-files-found: error
