name: Windows VST3 + Standalone

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-8.0.4-v2

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "SALEK HIGHTECH.vst3" | Select-Object -First 1
          $exe  = Get-ChildItem -Path build -Recurse -Filter "SALEK HIGHTECH.exe" | Select-Object -First 1
          if ($vst3) { Copy-Item -Recurse $vst3.FullName "artifact/SALEK HIGHTECH.vst3" }
          if ($exe)  { Copy-Item $exe.FullName "artifact/SALEK HIGHTECH.exe" }
          if (Test-Path artifact) {
            Compress-Archive -Path artifact/* -DestinationPath SALEK-HIGHTECH-Windows.zip -Force
            Get-ChildItem SALEK-HIGHTECH-Windows.zip
          } else {
            Write-Error "No artifacts found"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SALEK-HIGHTECH-Windows
          path: SALEK-HIGHTECH-Windows.zip
          if-no-files-found: error
